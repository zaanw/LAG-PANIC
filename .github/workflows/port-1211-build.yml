name: 1.21.1 loader builds (experimental)
on:
  push:
    branches:
      - 'port/1.21.1-fabric-neoforge'
    paths:
      - 'ports/1.21.1/**'
      - '.github/workflows/port-1211-build.yml'
  workflow_dispatch:
jobs:
  build-loader:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Minecraft 1.21.1 loader prototype
        working-directory: ports/1.21.1/${{ matrix.loader }}
        run: gradle --no-daemon clean build --stacktrace
