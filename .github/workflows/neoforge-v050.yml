name: NeoForge 1.21.1 v0.5.0 build
on:
  push:
    branches: ['feat/neoforge-1.21.1-v0.5.0']
    paths:
      - 'neoforge/**'
      - '.github/workflows/neoforge-v050.yml'
  pull_request:
    paths:
      - 'neoforge/**'
      - '.github/workflows/neoforge-v050.yml'
permissions:
  contents: read
jobs:
  neoforge:
    name: NeoForge 1.21.1 / Java 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build NeoForge and run unit tests
        run: gradle clean build --stacktrace --no-daemon
      - name: Verify NeoForge metadata in release jar
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/lagpanic-neoforge-1.21.1-*.jar)
          for jar in "${jars[@]}"; do
            [[ "$jar" == *sources.jar ]] && continue
            unzip -l "$jar" | grep -q 'META-INF/neoforge.mods.toml'
            unzip -l "$jar" | grep -q 'lagpanic.mixins.json'
            unzip -l "$jar" | grep -q 'EntityRenderDispatcherMixin.class'
            unzip -l "$jar" | grep -q 'ParticleEngineMixin.class'
            unzip -p "$jar" META-INF/neoforge.mods.toml | grep -q 'config="lagpanic.mixins.json"'
            echo "Verified NeoForge and client mixins: $jar"
            exit 0
          done
          echo "::error::No runtime NeoForge JAR found"
          exit 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lagpanic-neoforge-1.21.1-v0.5.0-development
          path: neoforge/build/libs/*jar
  client-smoke:
    name: NeoForge client menu startup smoke
    runs-on: ubuntu-latest
    needs: neoforge
    timeout-minutes: 12
    defaults:
      run:
        working-directory: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Launch real modded development client under virtual display
        shell: bash
        run: |
          set +e
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" timeout --signal=TERM 240s gradle runClient --no-daemon > client-smoke.log 2>&1
          result=$?
          set -e
          tail -n 120 client-smoke.log
          if [[ "$result" != 0 && "$result" != 124 ]]; then
            echo "::error::NeoForge client failed (exit $result)"
            exit 1
          fi
          if grep -Ei 'Mixin apply failed|MixinTransformerError|FATAL|Exception in thread|ModLoadingException' client-smoke.log runs/client/logs/latest.log 2>/dev/null; then
            echo "::error::Client error reported in logs"
            exit 1
          fi
          if ! grep -E 'Sound engine started|OpenAL initialized|Created: [0-9]+x[0-9]+x' client-smoke.log runs/client/logs/latest.log 2>/dev/null; then
            echo "::error::Client did not reach a verifiable initialized state"
            exit 1
          fi
          echo "Client reached render/audio initialization without an observed startup failure"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neoforge-1.21.1-client-smoke-logs
          path: |
            neoforge/client-smoke.log
            neoforge/runs/client/logs/*.log
            neoforge/runs/client/crash-reports/*
          if-no-files-found: ignore
