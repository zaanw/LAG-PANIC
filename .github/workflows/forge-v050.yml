name: Forge 1.20.1 v0.5.0 build
on:
  push:
    branches: ['feat/forge-1.20.1-v0.5.0']
    paths:
      - 'forge/**'
      - '.github/workflows/forge-v050.yml'
  pull_request:
    paths:
      - 'forge/**'
      - '.github/workflows/forge-v050.yml'
permissions:
  contents: read
jobs:
  forge:
    name: Forge 1.20.1 / Java 17
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge and run unit tests
        run: gradle clean build --stacktrace --no-daemon
      - name: Verify Forge metadata in release jar
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/lagpanic-forge-1.20.1-*.jar)
          for jar in "${jars[@]}"; do
            [[ "$jar" == *sources.jar ]] && continue
            unzip -l "$jar" | grep -q 'META-INF/mods.toml'
            echo "Verified $jar"
            exit 0
          done
          echo "::error::No runtime Forge JAR found"
          exit 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lagpanic-forge-1.20.1-v0.5.0-development
          path: forge/build/libs/*jar
