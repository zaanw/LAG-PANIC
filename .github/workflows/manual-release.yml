name: Publish verified JAR
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Verified release tag, e.g. v0.2.0-beta.1'
        required: true
        type: string
      runtime_tested:
        description: 'I have launched this exact commit in Minecraft 26.3 and tested panic/restore'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    if: ${{ inputs.runtime_tested == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        env:
          TAG: ${{ inputs.version }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build and test
        run: gradle clean build
      - name: Create release with direct .jar file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          gh release create "$TAG" build/libs/lagpanic-0.1.0.jar \
            --target "$GITHUB_SHA" --title "Lag Panic $TAG" \
            --notes "Verified manual release of Lag Panic. See README for limitations."
