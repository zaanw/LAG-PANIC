name: Fabric 1.20.x port verification
on:
  push:
    branches: ['feat/fabric-1.20.x']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  fabric:
    name: Fabric ${{ matrix.minecraft }} / Java ${{ matrix.java_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            fabric_api: '0.92.9+1.20.1'
            java_target: '17'
          - minecraft: '1.20.4'
            fabric_api: '0.97.3+1.20.4'
            java_target: '17'
          - minecraft: '1.20.6'
            fabric_api: '0.100.8+1.20.6'
            java_target: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and run unit tests
        run: >-
          gradle clean build --stacktrace --no-daemon
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pjava_target=${{ matrix.java_target }}
          -Pmod_version=0.3.0-fabric-${{ matrix.minecraft }}-dev
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lagpanic-fabric-${{ matrix.minecraft }}-development
          path: build/libs/lagpanic-fabric-${{ matrix.minecraft }}-*.jar
