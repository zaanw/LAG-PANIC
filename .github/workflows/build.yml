name: Fabric 26.x compatibility matrix
on:
  push:
    branches: ['feat/fabric-26x-matrix']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    name: Fabric ${{ matrix.minecraft }} / Java 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1'
            fabric_api: '0.145.1+26.1'
          - minecraft: '26.2'
            fabric_api: '0.160.0+26.2'
          - minecraft: '26.3'
            fabric_api: '0.165.2+26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and test Minecraft ${{ matrix.minecraft }}
        run: >-
          gradle clean build --no-daemon --stacktrace
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pmod_version=0.4.1-fabric-${{ matrix.minecraft }}-dev
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lagpanic-fabric-${{ matrix.minecraft }}-development
          path: build/libs/lagpanic-*.jar
