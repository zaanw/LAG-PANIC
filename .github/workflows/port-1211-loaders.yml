name: 1.21.1 experimental loader builds
on:
  push:
    branches:
      - 'port/1.21.1-fabric-neoforge'
  workflow_dispatch:
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build loader module
        working-directory: ports/1.21.1/${{ matrix.loader }}
        run: gradle --no-daemon build --stacktrace
