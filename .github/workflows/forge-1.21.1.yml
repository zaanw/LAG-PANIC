name: Forge 1.21.1 port validation
on:
  push:
    branches: ['feat/forge-1.21.1']
  pull_request:
    paths: ['forge/**', '.github/workflows/forge-1.21.1.yml']
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and run tests
        run: gradle clean build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lagpanic-forge-1.21.1-development
          path: forge/build/libs/lagpanic-forge-*.jar
