name: "✨ Feature request"
description: "Suggest a new feature or improvement for Lag Panic"
title: "[Feature Request] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Lag Panic! 🚀
        Please describe your idea. Feature requests are welcome, even if you don't know how to code.
        Before submitting, check whether someone has already suggested the same idea.
  - type: textarea
    id: idea
    attributes:
      label: "What would you like to see?"
      description: "Describe the feature or improvement you want added."
      placeholder: "I'd love a way to..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why would this be useful?"
      description: "Tell us what problem it would solve or how it could improve your experience."
      placeholder: "This would help when..."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Additional details (optional)"
      description: "Mockups, screenshots, examples, or other context."
    validations:
      required: false
  - type: checkboxes
    id: existing
    attributes:
      label: "Before submitting"
      options:
        - label: "I've checked that this feature hasn't already been requested."
          required: true
