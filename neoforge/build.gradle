plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = 'dev.zaan'
base { archivesName = "lagpanic-neoforge-${project.minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
    }
    mods {
        lagpanic {
            sourceSet sourceSets.main
        }
    }
}
repositories { mavenCentral() }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version, minecraft_version: project.minecraft_version) }
}

 
// Mojang renamed ResourceLocation to Identifier in Minecraft 1.21.11.
// Generate an isolated, version-specific source tree rather than altering the
// checked-in 1.21.1 sources or pretending one binary works on all versions.
if (project.minecraft_version == '1.21.11') {
    def generatedSrc = layout.buildDirectory.dir('generated/lagpanic-1.21.11/java')
    tasks.register('generate12111Sources', Copy) {
        from('src/main/java')
        into(generatedSrc)
        include('**/*.java')
        filter { line ->
            line.replace('net.minecraft.resources.ResourceLocation', 'net.minecraft.resources.Identifier')
                .replace('ResourceLocation.fromNamespaceAndPath', 'Identifier.fromNamespaceAndPath')
        }
    }
    sourceSets.main.java.setSrcDirs([generatedSrc])
    tasks.named('compileJava') { dependsOn 'generate12111Sources' }
}
