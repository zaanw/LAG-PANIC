plugins {
    id 'fabric-loom' version '1.10.5'
}
version = project.mod_version
group = 'dev.zaan'
base { archivesName = 'lagpanic-fabric-1.21.1' }
repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
sourceSets.main.java.srcDirs += ['../common/src/main/java', '../mc-common/src/main/java']
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
