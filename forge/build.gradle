plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'dev.zaan'
def mcVersion = providers.gradleProperty('minecraft_version').get()
def forgeVersion = providers.gradleProperty('forge_version').get()
version = providers.gradleProperty('mod_version').getOrElse("0.3.0-forge-${mcVersion}-dev")
base { archivesName = "lagpanic-forge-${mcVersion}" }
def mcParts = mcVersion.tokenize('.')
def nextPatch = mcParts[2].toInteger() + 1
def minecraftRange = "[${mcVersion},${mcParts[0]}.${mcParts[1]}.${nextPatch})"
def forgeMajor = forgeVersion.tokenize('.')[0]
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
minecraft {
    mappings channel: 'official', version: mcVersion
    runs {
        client {
            workingDirectory project.file('run')
            mods { lagpanic { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${forgeVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    inputs.properties([version: project.version, minecraftRange: minecraftRange, forgeMajor: forgeMajor])
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraftRange: minecraftRange, forgeMajor: forgeMajor
    }
}
reobf { jar {} }
jar {
    manifest {
        attributes([
            'Specification-Title': 'Lag Panic',
            'Specification-Vendor': 'zaan',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'
}
